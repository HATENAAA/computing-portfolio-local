<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>火焰检测 · 图像检测</title>
  <link rel="stylesheet" href="/static/navigation.css?v=station">
</head>
<body class="fw-station fw-image">
  <fw-navigation current="image"></fw-navigation>
  <script src="/static/navigation.js?v=station"></script>
  <main class="fw-workspace">
    <header class="fw-command">
      <h1>图像检测</h1>
      <div class="fw-actions">
        <button type="button" id="sample-image">分析公开样帧</button>
        <button type="button" data-open-image>打开图像</button>
        <a id="export" hidden>导出 JSON</a>
      </div>
    </header>

    <div class="fw-split">
      <section class="fw-viewer fw-panel" aria-label="图像复核区">
        <div class="viewer-header">
          <b id="current-file" title="FURG Car1 · 00:07">FURG Car1 · 00:07</b>
          <span id="canvas-meta">公开样帧 · 854 × 480 px</span>
        </div>
        <div class="viewer-tools">
          <div class="layer-buttons" role="group" aria-label="查看图层">
            <button type="button" data-view="original" aria-pressed="false" disabled>原图</button>
            <button type="button" data-view="overlay" aria-pressed="true" disabled>候选叠加</button>
            <button type="button" data-view="mask" aria-pressed="false" disabled>掩膜</button>
            <button type="button" data-view="compare" aria-pressed="false" disabled>并排复核</button>
          </div>
          <div class="zoom-tools" role="group" aria-label="画面缩放">
            <button type="button" id="zoom-out" aria-label="缩小" disabled>−</button>
            <output id="zoom-label">100%</output>
            <button type="button" id="zoom-in" aria-label="放大" disabled>＋</button>
            <button type="button" id="zoom-reset" disabled>适应</button>
          </div>
        </div>
        <div class="viewer-stage" id="drop">
          <div id="empty" class="image-preview">
            <img src="/static/furg-Car1-7s.png" width="854" height="480" alt="FURG Car1 的车辆火情公开样帧">
          </div>
          <div id="input-frame" class="image-preview" hidden><img id="input-preview" alt="待检测图像"></div>
          <div id="result" hidden>
            <div id="single-view" class="image-scroll"><img id="result-image" alt="候选区域叠加"></div>
            <div id="compare-view" hidden>
              <figure><img id="compare-original" alt="未加标记的输入图像"><figcaption>原图</figcaption></figure>
              <figure><img id="compare-overlay" alt="带候选区域标记的图像"><figcaption>候选叠加</figcaption></figure>
            </div>
          </div>
        </div>
        <footer class="viewer-status">
          <span id="status" role="status">待检测 · 可将图像拖入画面</span>
          <span>JPEG / PNG / WebP · ≤ 10 MB</span>
        </footer>
      </section>

      <aside class="image-inspector" aria-label="检测参数和结果">
        <section class="fw-panel">
          <header class="fw-panel-header"><h2>检测结果</h2><span id="analysis-state">待检测</span></header>
          <div class="fw-panel-body">
            <div class="verdict-row"><span>规则判定</span><strong id="verdict">—</strong></div>
            <dl class="measurements">
              <div><dt>候选区域占比</dt><dd id="area">—</dd></div>
              <div><dt>处理耗时</dt><dd id="elapsed">—</dd></div>
            </dl>
            <details class="method-detail">
              <summary>查看算子明细</summary>
              <div class="fw-scroll">
                <table class="fw-table"><thead><tr><th>算子</th><th id="method-heading">边缘邻域命中率</th><th>判定</th></tr></thead><tbody id="methods"></tbody></table>
              </div>
              <p class="measurement-note">运行检测后显示算子明细。</p>
            </details>
          </div>
        </section>
        <section class="fw-panel">
          <header class="fw-panel-header"><h2>检测参数</h2></header>
          <form id="analyze-form" class="fw-panel-body">
            <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
            <label>分析引擎<select id="image-engine"><option value="cpp">C++ 区域内核</option><option value="legacy">旧版四算子对照</option></select></label>
            <div class="parameter-grid">
              <label class="brightness-setting">亮度阈值 <output id="brightness-value" for="brightness">150</output><input name="brightness" id="brightness" type="range" min="0" max="255" value="150"></label>
              <label id="edge-setting">边缘邻域命中阈值<input name="edge_ratio" type="number" min="0" max="1" step="0.05" value="0.6" required></label>
              <label>最小区域占比<input name="min_area_ratio" type="number" min="0" max="1" step="0.001" value="0.002" required></label>
              <label>最小连通域像素<input name="min_component" type="number" min="1" max="100000" step="1" value="40" required></label>
            </div>
            <button id="submit" class="fw-primary" type="submit" disabled>运行检测</button>
          </form>
        </section>
      </aside>
    </div>

    <details class="fw-panel history-panel">
      <summary>图像检测历史</summary>
      <div id="history-list">暂无历史结果</div>
    </details>
  </main>
  <script src="/static/app.js?v=station"></script>
</body>
</html>
