<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pavia Centre · 论文重建结果</title><style>*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#27252d;font:16px/1.6 system-ui}.archive{max-width:1040px;margin:0 auto;padding:clamp(18px,4vw,48px)}a{color:#644783}h1{font:500 clamp(29px,4vw,45px) Georgia,serif;margin:.6em 0 .15em}p{margin:0 0 1em}figure{margin:0}.images{display:grid;grid-template-columns:1fr 1fr;gap:16px}.images img,.overlay img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain;image-rendering:pixelated}figcaption,small{color:#51495c}fieldset{border:0;padding:0;margin:15px 0}label{margin-right:16px}.overlay{position:relative;max-width:480px;margin:auto}.overlay .before{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--split,50%)) 0 0)}.overlay:after{content:"";position:absolute;inset-block:0;left:var(--split,50%);border-left:2px solid white}input{accent-color:#694b8c}input[type=range]{width:min(50vw,300px)}h2{margin:15px 0 4px;font-size:18px}</style><main class="archive"><a href="/">← 返回重建工作台</a><h1>Pavia Centre · ×4</h1><p>论文归档中的同一区域，比较 ERCSR 与加入 MCArb 后的重建结果。</p><fieldset><legend>查看方式</legend><label><input name="mode" value="pair" type="radio" checked>并排</label><label><input name="mode" value="wipe" type="radio">滑动对照</label><label><input type="checkbox" id="error-map">误差图</label></fieldset><div class="images"><figure><img data-model="ERCSR" alt="ERCSR"><figcaption>ERCSR</figcaption></figure><figure><img data-model="MCArb_ERCSR" alt="MCArb-ERCSR"><figcaption>MCArb-ERCSR</figcaption></figure></div><div id="wipe" hidden><div class="overlay"><img data-model="MCArb_ERCSR" alt="右侧 MCArb-ERCSR"><img class="before" data-model="ERCSR" alt="左侧 ERCSR"></div><label>ERCSR 显示比例 <input type="range" value="50" min="0" max="100"><output>50%</output></label></div><p><a href="/api/thesis-table">下载论文表 4.1（CSV）</a></p></main><script>
const pair=document.querySelector('.images'),wipe=document.querySelector('#wipe'),errorMap=document.querySelector('#error-map'),slider=wipe.querySelector('input');
function update(){const overlay=document.querySelector('[name=mode]:checked').value==='wipe';pair.style.display=overlay?'none':'';wipe.hidden=!overlay;document.querySelectorAll('[data-model]').forEach(img=>{img.src='/api/thesis-image?model='+img.dataset.model+'&view='+(errorMap.checked?'error':'reconstruction');});}
document.querySelector('fieldset').onchange=update;slider.oninput=()=>{wipe.style.setProperty('--split',slider.value+'%');wipe.querySelector('output').value=slider.value+'%';};update();
</script></html>
